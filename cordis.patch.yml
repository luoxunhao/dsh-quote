# dsh-quote bundle patch
#
# This file is the `dsh.bundle.patch` layer: when the plugin is installed
# through the official CLI —
#
#   dsh plugin --profile <name> add dsh-quote
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-quote` to the bundle stack. The
# profile boot then merges THIS patch (a single `insert` of the plugin row)
# exactly like a manual cordis.patch.yml mount line.
#
# Local development without installing: mount via
#   dsh web --profile web --patch <absolute>/dsh-quote/cordis.patch.yml
- insert:
    - id: quote
      name: dsh-quote
